# Unit prices for perf/cost.py, europe-central2 (Warsaw), list prices in USD.
#
# Source: Cloud Billing Catalog API (GET https://cloudbilling.googleapis.com/
# v1/services/{service}/skus?currencyCode=USD), read on 2026-11-22; the
# SKUs below were effective from 2026-11-21. Services: Cloud Dataflow
# (57D6-8E6B-2DE0), Vertex AI (C7E2-9256-1C43). Human-readable pages:
#   https://cloud.google.com/dataflow/pricing
#   https://cloud.google.com/vertex-ai/pricing
#
# List prices only: no committed-use or free-tier discounts. Re-read the
# catalog before quoting a figure in the thesis; prices change. A null price
# means "not filled in", and the estimate is then left empty rather than
# undercounted.
checked_on: "2026-11-22"
currency: USD

# Dataflow service metrics (gcloud dataflow metrics list --source=service).
# divisor converts the metric's raw unit into the priced unit.
dataflow:
  TotalVcpuTime:             # vCPU-seconds -> vCPU-hours
    divisor: 3600
    unit: vCPU-hour
    price: 0.0828            # SKU "vCPU Time Streaming Warsaw"
  TotalMemoryUsage:          # MB-seconds -> GiB-hours
    divisor: 3686400
    unit: GiB-hour
    price: 0.004268          # SKU "RAM Time Streaming Warsaw"
  TotalPdUsage:              # GB-seconds -> GiB-hours (standard persistent disk)
    divisor: 3600
    unit: GiB-hour
    price: 0.000065          # SKU "Local Disk Time PD Standard Warsaw"
  TotalStreamingDataProcessed:   # Streaming Engine, billed by data processed
    divisor: 1
    unit: GiB
    price: 0.02178           # SKU "Streaming data processed for Warsaw"
  # If a job opts into resource-based Streaming Engine billing, it is billed
  # in Streaming Engine Compute Units instead (SKU "Streaming Engine Compute
  # Unit Warsaw", 0.108 USD per unit) and the line above does not apply.

# Vertex AI online prediction, price per replica-hour of the endpoint's
# machine type. n1-standard-8 = 8 vCPU + 30 GiB RAM:
#   8 x (0.046839 core + 0.006110 management fee)   = 0.423592
#   30 x (0.006277 RAM + 0.000819 management fee)   = 0.212880
#                                                     --------
#                                                     0.636472 USD/h
# SKUs "Vertex AI: Online/Batch Prediction N1 Predefined Instance Core/Ram
# running in Warsaw" and "... Management fee on N1 Instance Core/RAM in
# Warsaw". (docs/phase-1-steam-collection.md quotes ~0.38 USD/h, which
# leaves out the management fee and predates these SKUs.)
vertex:
  machine_type: n1-standard-8
  replica_hour_price: 0.636472

# Not priced: Pub/Sub (global SKUs; at these volumes the delivered bytes
# cost a fraction of a cent), BigQuery writes and queries, Cloud Build
# minutes and the publisher's Cloud Run execution.
