# Cloud Build config for the sentiment pipeline Flex Template.
#
# Build context is the repository root so the nlp package is included.
# Submit from the repo root:
#
#   gcloud builds submit --config dataflow/cloudbuild.yaml .
#
# Produces two artifacts:
#   1. the container image, tagged with the commit SHA;
#   2. the Flex Template spec JSON in GCS, which the launch points at.
#
# The spec pins the image by the SHA tag built in this run, so a launch
# always names an exact image rather than a moving :latest.
substitutions:
  _REGION: europe-central2
  _REPO: co-images-dev
  _IMAGE: sentiment-pipeline
  _TEMPLATE_SPEC: gs://co-dataflow-temp-dev/templates/sentiment-pipeline.json

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - dataflow/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:$COMMIT_SHA
      - .

  # Pushed explicitly rather than via `images:` because the spec build
  # below needs the image to already exist in the registry.
  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:$COMMIT_SHA

  - id: template-spec
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - dataflow
      - flex-template
      - build
      - ${_TEMPLATE_SPEC}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:$COMMIT_SHA
      - --sdk-language=PYTHON
      - --metadata-file=dataflow/metadata.json

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
