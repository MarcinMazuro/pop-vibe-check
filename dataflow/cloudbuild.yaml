# Cloud Build config for the sentiment pipeline Flex Template.
#
# Build context is the repository root so the nlp package is included.
#
# Two triggers share this file (see terraform/modules/cloud_build):
#   - pull request into main → _DEPLOY=false: build the image only. The
#     Dockerfile's import check still runs, so a broken pipeline image
#     fails the PR.
#   - push to main           → _DEPLOY=true: push the image tagged with the
#     full commit SHA and publish two template specs pinned to its digest:
#       ${_TEMPLATE_SPEC_DIR}/sentiment-pipeline-<sha>.json  (immutable)
#       ${_TEMPLATE_SPEC_DIR}/sentiment-pipeline.json        (current)
#     dataflow/launch.sh uses the current spec by default, or a specific
#     commit's spec with --sha.
#
# This build never starts a Dataflow job.
#
# Manual run from the repo root (build + publish specs):
#
#   gcloud builds submit --region=europe-central2 \
#     --service-account=projects/<project>/serviceAccounts/co-cloud-build-sa-dev@<project>.iam.gserviceaccount.com \
#     --gcs-source-staging-dir=gs://co-tf-artifacts-dev/cloudbuild/source \
#     --config dataflow/cloudbuild.yaml \
#     --substitutions=COMMIT_SHA=$(git rev-parse HEAD),_DEPLOY=true .
substitutions:
  _REGION: europe-central2
  _REPO: co-images-dev
  _IMAGE: sentiment-pipeline
  _TEMPLATE_SPEC_DIR: gs://co-dataflow-temp-dev/templates
  _DEPLOY: "false"

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - dataflow/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE}:${COMMIT_SHA}
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -ec
      - |
        if [ "${_DEPLOY}" != "true" ]; then
          echo "Build-only run (_DEPLOY=${_DEPLOY}); image not pushed."
          exit 0
        fi
        docker push ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE}:${COMMIT_SHA}

  # The spec pins the image by digest, so a launch names the exact image
  # this build produced even if the SHA tag were ever moved.
  - id: template-spec
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -ec
      - |
        if [ "${_DEPLOY}" != "true" ]; then
          echo "Build-only run (_DEPLOY=${_DEPLOY}); no template spec published."
          exit 0
        fi
        image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE}
        digest=$$(gcloud artifacts docker images describe "$$image:${COMMIT_SHA}" \
          --format='value(image_summary.digest)')
        versioned=${_TEMPLATE_SPEC_DIR}/sentiment-pipeline-${COMMIT_SHA}.json
        gcloud dataflow flex-template build "$$versioned" \
          --image="$$image@$$digest" \
          --sdk-language=PYTHON \
          --metadata-file=dataflow/metadata.json
        gcloud storage cp "$$versioned" ${_TEMPLATE_SPEC_DIR}/sentiment-pipeline.json

timeout: 3600s

options:
  logging: CLOUD_LOGGING_ONLY
  # No machineType: the regional default pool in europe-central2 rejects
  # the larger build machines on this project's quota. The default machine
  # is slower but sufficient.
