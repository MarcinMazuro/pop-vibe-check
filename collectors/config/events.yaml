# Clair Obscur: Expedition 33 - lifecycle events.
#
# Consumed by collectors.common.events_config. Each entry maps an event id (used
# as the EVENT_ID env var and as the GCS output path segment) to its name, type,
# and date.
#
# IMPORTANT: dates are best-effort and MUST be verified against public sources
# before merge (README "events.yaml" note). Entries flagged "# VERIFY" are
# anchored on memory/press coverage rather than a confirmed primary source.
# The two anchor dates (reveal, flying_waters) come from the project README.

events:
