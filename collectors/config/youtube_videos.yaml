# Clair Obscur: Expedition 33 - curated YouTube videos per event.
#
# Consumed by the YouTube collector. Each entry maps a canonical video to the
# lifecycle events it is relevant to (event_ids must match ids in events.yaml).
#
# IMPORTANT: the `id` fields below are PLACEHOLDERS. Replace each with the real
# 11-character YouTube video id (the `v=` parameter of the watch URL) before
# running the collector. Start with official trailers, the highest-comment-count
# launch reactions, and the major outlet reviews (IGN, GameSpot), then grow the
# list over time. Entries are flagged "# REPLACE" until verified.

videos:
