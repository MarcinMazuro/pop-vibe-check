    event_ids: [gameplay_trailer_flying_waters]

  - id: REPLACE_launch0 # REPLACE
    title: Clair Obscur Expedition 33 - launch trailer
    event_ids: [launch]

  - id: REPLACE_ign_rev # REPLACE
    title: Clair Obscur Expedition 33 - IGN review
    event_ids: [launch, critical_acclaim_wave]

  - id: REPLACE_gs_revi # REPLACE
    title: Clair Obscur Expedition 33 - GameSpot review
