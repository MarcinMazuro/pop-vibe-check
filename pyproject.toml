[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pop-vibe-check-collectors"
version = "0.1.0"
description = "Collectors, replay publisher, Beam sentiment pipeline and NLP models for pop-vibe-check."
requires-python = ">=3.12"
readme = "README.md"

[tool.setuptools]
packages = [
    "collectors",
    "collectors.common",
    "collectors.reddit",
    "collectors.youtube",
    "publisher",
    "dataflow",
    "nlp",
    "nlp.stub",
    "nlp.endpoint",
    "nlp.training",
    "nlp.tracking",
    "nlp.eval",
]

# ---------------------------------------------------------------------------
# Formatting
# ---------------------------------------------------------------------------
[tool.black]
line-length = 88
target-version = ["py312"]

# ---------------------------------------------------------------------------
# Linting (PEP 8 + docstrings)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py312"
src = ["collectors", "publisher", "dataflow", "nlp"]

[tool.ruff.lint]
# E/W: pycodestyle (PEP 8), F: pyflakes, I: isort, D: pydocstyle (docstrings),
# UP: pyupgrade, B: bugbear, ANN: missing type annotations.
select = ["E", "W", "F", "I", "D", "UP", "B", "ANN"]
ignore = [
    "D203",   # one-blank-line-before-class (conflicts with D211)
    "D213",   # multi-line-summary-second-line (conflicts with D212)
    "ANN401", # Any is unavoidable at the PRAW / google-api-client boundary
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests do not need full annotations or module/class docstrings.
"collectors/tests/*" = ["ANN", "D100", "D101", "D102", "D103", "D104"]
"publisher/tests/*" = ["ANN", "D100", "D101", "D102", "D103", "D104"]
"dataflow/tests/*" = ["ANN", "D100", "D101", "D102", "D103", "D104", "E402"]
"nlp/tests/*" = ["ANN", "D100", "D101", "D102", "D103", "D104", "D107"]

# ---------------------------------------------------------------------------
# Static typing
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
files = ["collectors", "publisher", "dataflow", "nlp"]

[[tool.mypy.overrides]]
# Tests use pytest fixtures and assert-style bodies; full annotations add noise.
module = "collectors.tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "publisher.tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["dataflow.tests.*", "nlp.tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disable_error_code = ["no-untyped-call"]

[[tool.mypy.overrides]]
# Beam's Python SDK ships largely unannotated: DoFn.process, ParDo, Map,
# PubsubMessage and the IO transforms are all untyped, so strict mode's
# no-untyped-call and override checks fire on ordinary, correct pipeline
# code. Narrowed to the two modules that touch the SDK — the pure record
# logic in dataflow.transforms stays fully strict-checked.
module = ["dataflow.pipeline", "dataflow.options"]
disable_error_code = ["no-untyped-call", "override", "misc"]

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["collectors/tests", "publisher/tests", "dataflow/tests", "nlp/tests"]
pythonpath = ["."]
